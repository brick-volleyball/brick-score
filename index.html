<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>バレー得点板</title>
<style>
  :root{
    --bg:#0a0e1a;
    --bg-panel:#111a2e;
    --bg-panel-raise:#16213a;
    --line: rgba(255,255,255,0.09);
    --text:#eef1fb;
    --text-dim:#8391b3;
    --team-a:#ff8a3d;
    --team-a-soft: rgba(255,138,61,0.14);
    --team-b:#35c9e1;
    --team-b-soft: rgba(53,201,225,0.14);
    --gold:#ffd23f;
    --danger:#ff5c72;
    --danger-soft: rgba(255,92,114,0.16);
    --font-display: 'Arial Narrow', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--text);
    font-family:var(--font-ui);
    overflow:hidden;
    overscroll-behavior:none;
    user-select:none;
  }
  #app{
    display:flex; flex-direction:column;
    width:100vw; height:100vh; height:100dvh;
  }

  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 0.6rem 1rem;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    flex: 0 0 auto;
    gap: 0.75rem;
  }
  .hdr-group{ display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
  .badge{
    font-size:0.68rem; color:var(--text-dim);
    background:var(--bg-panel-raise);
    border:1px solid var(--line);
    padding: 0.25rem 0.55rem;
    border-radius: 999px;
    letter-spacing:0.02em;
    white-space:nowrap;
  }
  .set-badge{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.15rem; letter-spacing:0.02em;
    background:var(--bg-panel-raise);
    border:1px solid var(--line);
    padding:0.3rem 0.9rem;
    border-radius:999px;
    color:var(--text);
    display:flex; align-items:center; gap:0.5rem;
  }
  .set-badge b{ color:var(--gold); font-weight:700; }
  select.fmt{
    background:var(--bg-panel-raise); color:var(--text-dim);
    border:1px solid var(--line); border-radius:999px;
    font-family:var(--font-ui); font-size:0.68rem;
    padding:0.25rem 0.5rem;
  }
  button{
    font-family:var(--font-ui);
    cursor:pointer;
    touch-action: manipulation;
  }
  .btn{
    background:var(--bg-panel-raise);
    color:var(--text);
    border:1px solid var(--line);
    border-radius: 8px;
    padding: 0.4rem 0.7rem;
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:0.02em;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    white-space:nowrap;
  }
  .btn:hover{ background:#1c2a47; }
  .btn.danger{ color:var(--danger); }
  .btn.danger.confirming{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
  .btn.pulse{ animation: pulse 1.1s ease-in-out infinite; border-color:var(--gold); color:var(--gold); }
  @keyframes pulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(255,210,63,0.35); }
    50%{ box-shadow: 0 0 0 6px rgba(255,210,63,0); }
  }
  .icon-btn{
    width: 2.1rem; height:2.1rem;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-panel-raise);
    border:1px solid var(--line);
    border-radius: 8px;
    color:var(--text-dim);
    font-size:1rem;
    touch-action: manipulation;
  }
  .icon-btn:hover{ color:var(--text); }

  /* ---------- main scoreboard ---------- */
  main{
    flex:1 1 auto;
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    min-height:0;
  }
  .team{
    position:relative;
    display:flex; flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:0;
    padding: 0.5rem 1rem 1rem;
  }
  .team.a{ background: linear-gradient(180deg, var(--team-a-soft), transparent 40%); }
  .team.b{ background: linear-gradient(180deg, var(--team-b-soft), transparent 40%); }

  .team-head{
    display:flex; align-items:center; gap:0.55rem;
    max-width:92%;
  }
  .serve-dot{
    width:1.1rem; height:1.1rem; border-radius:50%;
    background: var(--bg-panel-raise);
    border:1px solid var(--line);
    flex:0 0 auto;
    opacity:0.35;
    transition: opacity 0.15s, background 0.15s, box-shadow .15s;
    touch-action: manipulation;
  }
  .team.a .serve-dot.on{ background:var(--team-a); opacity:1; box-shadow:0 0 10px var(--team-a); }
  .team.b .serve-dot.on{ background:var(--team-b); opacity:1; box-shadow:0 0 10px var(--team-b); }

  .team-name{
    font-weight:900; font-size: clamp(1.1rem, 2.6vw, 1.9rem);
    max-width: 100%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    outline:none; border-bottom: 1px dashed transparent;
    padding: 0.1rem 0.15rem;
    user-select:text; -webkit-user-select:text;
    cursor:text;
  }
  .team-name:focus{ border-bottom-color: var(--text-dim); text-overflow:clip; overflow:visible; white-space:normal; }
  .team.a .team-name{ color:var(--team-a); }
  .team.b .team-name{ color:var(--team-b); }

  .score-row{
    display:flex; align-items:center; justify-content:center;
    gap: clamp(0.5rem, 2vw, 1.5rem);
    width:100%;
  }
  .set-lights{
    display:flex; flex-direction:column; align-items:center;
    gap: clamp(0.35rem, 1.6vh, 0.85rem);
    flex:0 0 auto;
  }
  .light{
    width: clamp(0.7rem, 1.8vw, 1.15rem);
    height: clamp(0.7rem, 1.8vw, 1.15rem);
    border-radius:50%;
    border:2px solid var(--line);
    background:transparent;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .light.lit.a{ background:var(--team-a); border-color:var(--team-a); box-shadow:0 0 10px var(--team-a); }
  .light.lit.b{ background:var(--team-b); border-color:var(--team-b); box-shadow:0 0 10px var(--team-b); }

  .score-btn{
    appearance:none; -webkit-appearance:none; border:none; background:transparent; color:var(--text);
    font-family:var(--font-display); font-weight:700;
    font-variant-numeric: tabular-nums;
    font-size: clamp(6rem, 24vw, 15rem);
    line-height:0.9;
    padding: 0.1em 0.15em;
    margin: 0.1em 0 0;
    border-radius: 1.2rem;
    transition: background 0.1s, transform 0.06s;
    touch-action: manipulation;
  }
  .score-btn:active{ transform: scale(0.97); background: rgba(255,255,255,0.06); }

  .minus-btn{
    width:2.3rem; height:2.3rem; border-radius:50%;
    background:var(--bg-panel-raise); border:1px solid var(--line);
    color:var(--text-dim); font-size:1.2rem; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    margin-top:0.3rem;
    touch-action: manipulation;
  }
  .minus-btn:hover{ color:var(--danger); border-color:var(--danger); }

  .divider{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:0.6rem; padding: 0 0.75rem;
    border-left:1px solid var(--line); border-right:1px solid var(--line);
  }
  .divider .vs{
    font-family:var(--font-display); font-weight:700;
    font-size:1.6rem; color:var(--text-dim); letter-spacing:0.02em;
  }
  .divider .sets-line{
    font-family:var(--font-display); font-weight:700;
    font-variant-numeric: tabular-nums;
    font-size:1.9rem; display:flex; align-items:center; gap:0.4rem;
  }
  .divider .sets-line .a{ color:var(--team-a); }
  .divider .sets-line .b{ color:var(--team-b); }
  .divider .sets-line .sep{ color:var(--text-dim); font-size:1.1rem; }

  .swap-btn{
    width:2.3rem; height:2.3rem; border-radius:50%;
    background:var(--bg-panel-raise); border:1px solid var(--line);
    color:var(--text-dim); display:flex; align-items:center; justify-content:center;
    font-size:1.1rem;
    touch-action: manipulation;
  }
  .swap-btn:hover{ color:var(--gold); border-color:var(--gold); }

  /* ---------- footer / history ---------- */
  footer{
    flex:0 0 auto;
    background:var(--bg-panel);
    border-top:1px solid var(--line);
    padding: 0.4rem 1rem;
    font-size:0.7rem; color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    gap:1rem;
    overflow-x:auto;
    -webkit-overflow-scrolling: touch;
    white-space:nowrap;
  }
  footer .hist-item{
    display:flex; align-items:center; gap:0.3rem;
    padding: 0.15rem 0.6rem;
    border:1px solid var(--line);
    border-radius:999px;
    flex: 0 0 auto;
  }
  footer .hist-item .a{ color:var(--team-a); font-weight:700; }
  footer .hist-item .b{ color:var(--team-b); font-weight:700; }

  /* ---------- winner overlay ---------- */
  #winOverlay{
    position:fixed; inset:0; background:rgba(6,9,18,0.92);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    gap:1.2rem; z-index:50; text-align:center; padding:1rem;
  }
  #winOverlay.show{ display:flex; }
  #winOverlay .trophy{ font-size:3.5rem; }
  #winOverlay .name{
    font-family:var(--font-display); font-weight:700;
    font-size: clamp(2rem, 7vw, 4rem);
    letter-spacing:0.02em;
  }
  #winOverlay .sub{ color:var(--text-dim); font-size:0.9rem; }

  /* ---------- rotate hint ---------- */
  #rotateHint{
    position:fixed; left:0.75rem; bottom:0.75rem;
    background:var(--bg-panel-raise); border:1px solid var(--line);
    color:var(--text-dim); font-size:0.68rem;
    padding:0.4rem 0.7rem; border-radius:8px;
    display:none; align-items:center; gap:0.4rem;
    z-index:40;
  }
  @media (max-width:640px) and (orientation:portrait){
    #rotateHint{ display:flex; }
  }

  @media (prefers-reduced-motion: reduce){
    .btn.pulse{ animation:none; }
  }

  /* ===== サポーター登録確認ゲート(他のBRICKツールと同じ仕組み) =====
     Firebase Authでログイン状態を確認し、Firestoreのsubscriptions/{email}で
     サポーター登録が有効かどうかを判定する。管理者アカウント(ADMIN_EMAILS)は
     登録状況にかかわらず常に許可。判定が終わるまで#appRootは非表示。 */
  #appRoot{ display:none; }
  #appRoot.ready{ display:block; }
  #authOverlay{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:flex; align-items:center; justify-content:center; flex-direction:column; padding:20px;
  }
  #authOverlay.done{ display:none; }
  .auth-spinner{
    width:40px; height:40px; border-radius:50%;
    border:4px solid var(--line); border-top-color:var(--gold);
    animation: auth-spin 0.8s linear infinite; margin:0 auto 16px;
  }
  @keyframes auth-spin{ to{ transform:rotate(360deg); } }
  .auth-status-label{ font-size:14px; color:var(--text-dim); text-align:center; font-family:var(--font-ui); }
</style>
</head>
<body>

<!-- ============================================================
     サポーター登録確認ゲート
     brick-video-clipper等と同じFirebase Auth + Firestoreの仕組み。
     判定が終わる(showAppが呼ばれる)まで#appRootは非表示のまま。
     ============================================================ -->
<div id="authOverlay">
  <div class="auth-spinner"></div>
  <div class="auth-status-label" id="authStatusLabel">サポーター登録を確認しています…</div>
</div>

<div id="appRoot">

<div id="app">
  <header>
    <div class="hdr-group">
      <span class="badge" id="versionBadge">v1.0.0</span>
      <button class="icon-btn" id="fullscreenBtn" title="全画面表示">⛶</button>
    </div>

    <div class="hdr-group">
      <div class="set-badge">SET <b id="setNum">1</b></div>
      <select class="fmt" id="fmtSelect" title="マッチ形式">
        <option value="5">5セットマッチ</option>
        <option value="3">3セットマッチ</option>
      </select>
    </div>

    <div class="hdr-group">
      <button class="btn" id="undoBtn">↩ 元に戻す</button>
      <button class="btn" id="endSetBtn">このセット終了</button>
      <button class="btn danger" id="resetBtn">試合リセット</button>
    </div>
  </header>

  <main>
    <section class="team a" id="teamAPanel">
      <div class="team-head">
        <span class="serve-dot" id="serveA" title="サーブ権"></span>
        <span class="team-name" id="nameA" contenteditable="true" spellcheck="false">BRICK</span>
      </div>
      <div class="score-row">
        <div class="set-lights" id="lightsA"></div>
        <button class="score-btn" id="scoreA">0</button>
      </div>
      <button class="minus-btn" id="minusA" title="1点マイナス">−</button>
    </section>

    <div class="divider">
      <button class="swap-btn" id="swapBtn" title="コート交代(表示入れ替え)">⇄</button>
      <div class="sets-line"><span class="a" id="setsLineA">0</span><span class="sep">-</span><span class="b" id="setsLineB">0</span></div>
      <div class="vs">VS</div>
    </div>

    <section class="team b" id="teamBPanel">
      <div class="team-head">
        <span class="serve-dot" id="serveB" title="サーブ権"></span>
        <span class="team-name" id="nameB" contenteditable="true" spellcheck="false">対戦相手</span>
      </div>
      <div class="score-row">
        <button class="score-btn" id="scoreB">0</button>
        <div class="set-lights" id="lightsB"></div>
      </div>
      <button class="minus-btn" id="minusB" title="1点マイナス">−</button>
    </section>
  </main>

  <footer id="history">
    <span>第1セット進行中</span>
  </footer>
</div>

<div id="rotateHint">📱 横向きにするとさらに見やすくなります</div>

<div id="winOverlay">
  <div class="trophy">🏆</div>
  <div class="name" id="winName"></div>
  <div class="sub" id="winSub"></div>
  <button class="btn" id="winCloseBtn">閉じる</button>
</div>

</div><!-- /#appRoot -->

<script>
(function(){
  "use strict";
  // バージョン表記: 更新のたびにここを書き換える(プロジェクトの依頼事項に対応)
  var VERSION = "v1.2.0";
  var VERSION_DATE = "2026-09-08";
  var SET_LIGHTS = 4;
  document.getElementById('versionBadge').textContent = VERSION + " (" + VERSION_DATE + ")";

  var STORAGE_KEY = "brick-volleyball-scoreboard-state-v1";

  var defaultState = {
    nameA: "BRICK",
    nameB: "対戦相手",
    scoreA: 0,
    scoreB: 0,
    setsWonA: 0,
    setsWonB: 0,
    currentSet: 1,
    format: 5,
    serve: null,      // 'A' | 'B' | null
    history: [],       // [{a,b}]
    swapped: false
  };

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return JSON.parse(JSON.stringify(defaultState));
      var parsed = JSON.parse(raw);
      return Object.assign({}, defaultState, parsed);
    }catch(e){
      return JSON.parse(JSON.stringify(defaultState));
    }
  }

  var state = loadState();
  var undoStack = [];

  function snapshot(){
    undoStack.push(JSON.stringify(state));
    if(undoStack.length > 30) undoStack.shift();
  }

  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function setsToWin(){ return state.format === 3 ? 2 : 3; }
  function pointsToWin(isFinalSet){
    // final set of a 3-set match is set 3, of a 5-set match is set 5
    return isFinalSet ? 15 : 25;
  }
  function isFinalSet(){
    return state.currentSet >= state.format;
  }

  var el = {};
  ["setNum","fmtSelect","nameA","nameB","scoreA","scoreB","lightsA","lightsB",
   "serveA","serveB","setsLineA","setsLineB","history","undoBtn","endSetBtn",
   "resetBtn","swapBtn","minusA","minusB","fullscreenBtn","winOverlay","winName",
   "winSub","winCloseBtn"].forEach(function(id){ el[id] = document.getElementById(id); });

  // Which side (win/loss) each set went to, in play order, for a given team key.
  // Lit = that team won that set. Not-yet-played sets render the same as a loss
  // (unlit) -- matching a real electronic scoreboard, where a light only ever
  // turns on for a set actually won.
  function lightsFor(key){
    var arr = [];
    for(var i=0;i<SET_LIGHTS;i++){
      var lit = false;
      var h = state.history[i];
      if(h){ lit = key === 'A' ? h.a > h.b : h.b > h.a; }
      arr.push(lit);
    }
    return arr;
  }

  function fillLights(container, key){
    var teamClass = key === 'A' ? 'a' : 'b';
    container.innerHTML = lightsFor(key).map(function(lit){
      return '<span class="light' + (lit ? ' lit ' + teamClass : '') + '"></span>';
    }).join('');
  }

  function render(){
    el.setNum.textContent = state.currentSet;
    el.fmtSelect.value = String(state.format);

    var leftKey = state.swapped ? 'B' : 'A';
    var rightKey = state.swapped ? 'A' : 'B';

    function fill(side, key){
      var nameEl = side === 'left' ? el.nameA : el.nameB;
      var scoreEl = side === 'left' ? el.scoreA : el.scoreB;
      var lightsEl = side === 'left' ? el.lightsA : el.lightsB;
      var serveEl = side === 'left' ? el.serveA : el.serveB;

      if(document.activeElement !== nameEl){
        nameEl.textContent = key === 'A' ? state.nameA : state.nameB;
      }
      scoreEl.textContent = key === 'A' ? state.scoreA : state.scoreB;
      fillLights(lightsEl, key);
      serveEl.classList.toggle('on', state.serve === key);
    }
    fill('left', leftKey);
    fill('right', rightKey);

    el.setsLineA.textContent = state.setsWonA;
    el.setsLineB.textContent = state.setsWonB;

    // win-condition highlight on the end-set button
    var final = isFinalSet();
    var target = pointsToWin(final);
    var a = state.scoreA, b = state.scoreB;
    var setPoint = (a >= target || b >= target) && Math.abs(a - b) >= 2;
    el.endSetBtn.classList.toggle('pulse', setPoint);

    // history footer
    if(state.history.length === 0){
      el.history.innerHTML = '<span>第' + state.currentSet + 'セット進行中</span>';
    }else{
      el.history.innerHTML = state.history.map(function(h, i){
        return '<span class="hist-item">第' + (i+1) + 'セット '
          + '<span class="a">' + h.a + '</span>-<span class="b">' + h.b + '</span></span>';
      }).join('') + '<span>第' + state.currentSet + 'セット進行中</span>';
    }

    persist();
  }

  function leftKeyNow(){ return state.swapped ? 'B' : 'A'; }
  function rightKeyNow(){ return state.swapped ? 'A' : 'B'; }

  function addScore(key, delta){
    snapshot();
    if(key === 'A') state.scoreA = Math.max(0, state.scoreA + delta);
    else state.scoreB = Math.max(0, state.scoreB + delta);
    if(delta > 0) state.serve = key;
    render();
  }

  el.scoreA.addEventListener('click', function(){ addScore(leftKeyNow(), 1); });
  el.scoreB.addEventListener('click', function(){ addScore(rightKeyNow(), 1); });
  el.minusA.addEventListener('click', function(e){ e.stopPropagation(); addScore(leftKeyNow(), -1); });
  el.minusB.addEventListener('click', function(e){ e.stopPropagation(); addScore(rightKeyNow(), -1); });

  el.serveA.addEventListener('click', function(){ snapshot(); state.serve = leftKeyNow(); render(); });
  el.serveB.addEventListener('click', function(){ snapshot(); state.serve = rightKeyNow(); render(); });

  el.nameA.addEventListener('blur', function(){
    var key = leftKeyNow();
    var val = el.nameA.textContent.trim() || (key === 'A' ? 'チームA' : 'チームB');
    snapshot();
    if(key === 'A') state.nameA = val; else state.nameB = val;
    render();
  });
  el.nameA.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); el.nameA.blur(); } });
  el.nameB.addEventListener('blur', function(){
    var key = rightKeyNow();
    var val = el.nameB.textContent.trim() || (key === 'A' ? 'チームA' : 'チームB');
    snapshot();
    if(key === 'A') state.nameA = val; else state.nameB = val;
    render();
  });
  el.nameB.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); el.nameB.blur(); } });

  el.fmtSelect.addEventListener('change', function(){
    snapshot();
    state.format = parseInt(el.fmtSelect.value, 10);
    render();
  });

  el.swapBtn.addEventListener('click', function(){
    snapshot();
    state.swapped = !state.swapped;
    render();
  });

  el.undoBtn.addEventListener('click', function(){
    if(undoStack.length === 0) return;
    state = JSON.parse(undoStack.pop());
    render();
  });

  el.endSetBtn.addEventListener('click', function(){
    snapshot();
    state.history.push({ a: state.scoreA, b: state.scoreB });
    if(state.scoreA > state.scoreB) state.setsWonA++;
    else if(state.scoreB > state.scoreA) state.setsWonB++;

    var need = setsToWin();
    if(state.setsWonA >= need || state.setsWonB >= need){
      var winnerName = state.setsWonA >= need ? state.nameA : state.nameB;
      var winnerSets = Math.max(state.setsWonA, state.setsWonB);
      var loserSets = Math.min(state.setsWonA, state.setsWonB);
      el.winName.textContent = winnerName + " の勝利!";
      el.winSub.textContent = "セットカウント " + winnerSets + " - " + loserSets;
      el.winOverlay.classList.add('show');
    }

    state.scoreA = 0;
    state.scoreB = 0;
    state.currentSet = Math.min(state.currentSet + 1, state.format);
    state.serve = null;
    render();
  });

  el.winCloseBtn.addEventListener('click', function(){
    el.winOverlay.classList.remove('show');
  });

  // confirm-to-confirm reset (誤タップ防止のため、2回連続タップで確定)
  var resetConfirming = false, resetTimer = null;
  el.resetBtn.addEventListener('click', function(){
    if(!resetConfirming){
      resetConfirming = true;
      el.resetBtn.textContent = "本当に? もう一度タップ";
      el.resetBtn.classList.add('confirming');
      resetTimer = setTimeout(function(){
        resetConfirming = false;
        el.resetBtn.textContent = "試合リセット";
        el.resetBtn.classList.remove('confirming');
      }, 3000);
      return;
    }
    clearTimeout(resetTimer);
    resetConfirming = false;
    el.resetBtn.textContent = "試合リセット";
    el.resetBtn.classList.remove('confirming');
    snapshot();
    var keepNames = { nameA: state.nameA, nameB: state.nameB, format: state.format };
    state = Object.assign(JSON.parse(JSON.stringify(defaultState)), keepNames);
    el.winOverlay.classList.remove('show');
    render();
  });

  // fullscreen(非対応環境では無視)
  el.fullscreenBtn.addEventListener('click', function(){
    try{
      if(!document.fullscreenElement){
        document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      }else{
        document.exitFullscreen && document.exitFullscreen();
      }
    }catch(e){ /* fullscreen unavailable in this context */ }
  });

  render();
})();
</script>

<!-- ============================================================
     サポーター登録確認(Firebase Auth + Firestore)
     他のBRICKツールと同一のFirebase設定・判定ロジックを使用する。
     判定が終わるまで#appRootは非表示(#authOverlayが最前面)。
     未ログイン・未登録の場合はサポーター登録ページへ誘導する。
     ============================================================ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ---- Firebase設定(tools/index.html, 他のBRICKツールと同一) ----
  const firebaseConfig = {
    apiKey: "AIzaSyCn0rLPeyN_hw3_lLaYw1UMAzsSK3DpxuM",
    authDomain: "team-video-uploader-503720.firebaseapp.com",
    projectId: "team-video-uploader-503720",
    storageBucket: "team-video-uploader-503720.firebasestorage.app",
    messagingSenderId: "551674365524",
    appId: "1:551674365524:web:f67d5524bc0b3ccec70fc1",
    measurementId: "G-S97JSJJC1N"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);

  // ---- 管理者アカウント ----
  // ここに載せたメールアドレスは、Firestoreのサポーター登録状況にかかわらず
  // 常にツールを利用できる
  const ADMIN_EMAILS = ["akzds5456@gmail.com", "brick.volley@gmail.com"];

  // 未ログイン・未登録の場合の戻り先
  const TOOLS_URL = "https://brick-volleyball.github.io/tools/";

  const authOverlay = document.getElementById("authOverlay");
  const authStatusLabel = document.getElementById("authStatusLabel");
  const appRoot = document.getElementById("appRoot");

  function showApp() {
    authOverlay.classList.add("done");
    appRoot.classList.add("ready");
  }

  function blockAndRedirect(msg) {
    authStatusLabel.textContent = msg;
    setTimeout(() => { window.location.href = TOOLS_URL; }, 1500);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user || !user.email) {
      blockAndRedirect("サポーター登録が必要です。ログインページへ移動します…");
      return;
    }

    // 管理者アカウントは登録状況を見ずに常に許可
    if (ADMIN_EMAILS.includes(user.email)) {
      showApp();
      return;
    }

    try {
      const subRef = doc(db, "subscriptions", user.email);
      const subSnap = await getDoc(subRef);

      if (subSnap.exists()) {
        const data = subSnap.data();
        const isActive = data.status === "active";
        const notExpired = !data.currentPeriodEnd || (new Date(data.currentPeriodEnd.toDate ? data.currentPeriodEnd.toDate() : data.currentPeriodEnd) > new Date());

        if (isActive && notExpired) {
          showApp();
          return;
        }
      }

      blockAndRedirect("サポーター登録が確認できませんでした。ログインページへ戻ります…");
    } catch (err) {
      console.error(err);
      blockAndRedirect("確認中にエラーが発生しました。ログインページへ戻ります…");
    }
  });
</script>
